<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" fill="#f3f4f6" rx="4"/>

  <!-- Main building -->
  <rect x="8" y="12" width="7" height="16" fill="#374151" stroke="#1f2937" stroke-width="0.5"/>
  <rect x="17" y="8" width="7" height="20" fill="#4b5563" stroke="#1f2937" stroke-width="0.5"/>

  <!-- Windows on left building -->
  <rect x="9.5" y="14" width="1.5" height="2" fill="#d1d5db"/>
  <rect x="13" y="14" width="1.5" height="2" fill="#d1d5db"/>
  <rect x="9.5" y="18" width="1.5" height="2" fill="#d1d5db"/>
  <rect x="13" y="18" width="1.5" height="2" fill="#d1d5db"/>
  <rect x="9.5" y="22" width="1.5" height="2" fill="#d1d5db"/>
  <rect x="13" y="22" width="1.5" height="2" fill="#d1d5db"/>

  <!-- Windows on right building -->
  <rect x="18.5" y="10" width="1.5" height="2" fill="#e5e7eb"/>
  <rect x="22" y="10" width="1.5" height="2" fill="#e5e7eb"/>
  <rect x="18.5" y="14" width="1.5" height="2" fill="#e5e7eb"/>
  <rect x="22" y="14" width="1.5" height="2" fill="#e5e7eb"/>
  <rect x="18.5" y="18" width="1.5" height="2" fill="#e5e7eb"/>
  <rect x="22" y="18" width="1.5" height="2" fill="#e5e7eb"/>
  <rect x="18.5" y="22" width="1.5" height="2" fill="#e5e7eb"/>
  <rect x="22" y="22" width="1.5" height="2" fill="#e5e7eb"/>

  <!-- Ground line -->
  <line x1="4" y1="28" x2="28" y2="28" stroke="#6b7280" stroke-width="1"/>
</svg>
